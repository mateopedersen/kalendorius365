odis</figcaption></figure><figure><img src="/site/assets/visuals/2027-monthly-holidays/2027-birzelio-sventes-hero.svg" width="1200" height="800" alt="Ąžuolo lapų ir žiedų vainikas prie ramaus ežero, o tolumoje – Joninių laužas."><figcaption>06 · Rasų vakaras</figcaption></figure><figure><img src="/site/assets/visuals/2027-monthly-holidays/2027-liepos-sventes-hero.svg" width="1200" height="800" alt="Simbolinė auksinė karūna, žalias Vilniaus piliakalnis ir stilizuotas Gedimino pilies bokštas."><figcaption>07 · Valstybingumo vasara</figcaption></figure><figure><img src="/site/assets/visuals/2027-monthly-holidays/2027-rugpjucio-sventes-hero.svg" width="1200" height="800" alt="Žolinę primenanti javų varpų, lapų ir pievų žiedų puokštė, surišta audinio juosta."><figcaption>08 · Žolynų ir javų laikas</figcaption></figure><figure><img src="/site/assets/visuals/2027-monthly-holidays/2027-rugsejo-sventes-hero.svg" width="1200" height="800" alt="Atversta knyga, rašiklis, sąsiuvinis ir rusvi lapai ant medinio mokymosi stalo."><figcaption>09 · Žinių pradžia</figcaption></figure><figure><img src="/site/assets/visuals/2027-monthly-holidays/2027-spalio-sventes-hero.svg" width="1200" height="800" alt="Tamsiai žalias dokumentų tomas, žalvario spalvos rašiklio plunksna ir gintariniai rudens lapai."><figcaption>10 · Pilietiškumo puslapiai</figcaption></figure><figure><img src="/site/assets/visuals/2027-monthly-holidays/2027-lapkricio-sventes-hero.svg" width="1200" height="800" alt="Šiltai šviečiančios atminimo žvakės stiklo indeliuose, nukritę lapai ir tylios medžių šakos."><figcaption>11 · Ramus atminimo vakaras</figcaption></figure><figure><img src="/site/assets/visuals/2027-monthly-holidays/2027-gruodzio-sventes-hero.svg" width="1200" height="800" alt="Šiaudinių sodų formų papuošalai, žvakė, eglės šakelės ir dubuo kūčiukų ant lino staltiesės."><figcaption>12 · Kūčių vakaro ramybė</figcaption></figure></main></html>
