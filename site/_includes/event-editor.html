<dialog id="event-dialog" aria-labelledby="event-dialog-title">
  <form id="event-form">
    <div class="panel-title"><h2 id="event-dialog-title">Naujas įvykis</h2><button type="button" id="close-event" aria-label="Uždaryti įvykio langą">×</button></div>
    <input type="hidden" name="id">
    <label>Pavadinimas<input name="title" required maxlength="200"></label>
    <label class="check"><input name="allDay" type="checkbox">Visa diena</label>
    <div class="form-row"><label>Pradžios data<input name="startDate" type="date" required></label><label>Pabaigos data<input name="endDate" type="date" required></label></div>
    <div class="form-row" id="event-times"><label>Pradžios laikas<input name="startTime" type="time" value="09:00" required></label><label>Pabaigos laikas<input name="endTime" type="time" value="10:00" required></label></div>
    <label>Kategorija<select name="category"><option value="0">Asmeniniai</option><option value="1">Darbas</option><option value="2">Mokslai</option><option value="3">Sveikata</option><option value="4">Šeima</option><option value="5">Gimtadieniai</option><option value="6">Kiti</option></select></label>
    <label>Aprašymas<textarea name="description" rows="2" maxlength="5000"></textarea></label>
    <div class="form-row"><label>Kartojimas<select name="repeat"><option value="none">Nesikartoja</option><option value="daily">Kasdien</option><option value="weekly">Kas savaitę</option><option value="monthly">Kas mėnesį tą pačią dieną</option><option value="yearly">Kasmet tą pačią datą</option></select></label><label>Kartoti iki (neprivaloma)<input name="until" type="date"></label></div>
    <label id="event-reminder-field" hidden>Priminimas<select name="reminder" disabled>{% include calendar-reminder-options.html %}</select></label>
    <label class="check"><input name="important" type="checkbox">Svarbus įvykis</label>
    <small>Pasikartojantys įvykiai trunka vieną dieną ir išlaiko Vilniaus vietinį laiką. Neegzistuojančios datos praleidžiamos; rudenį pasikartojančią valandą pasirenkamas ankstesnis laikas.</small>
    <p id="event-error" role="alert" class="danger" hidden></p>
    <div class="form-actions"><button id="delete-event" type="button" class="danger" hidden>Ištrinti visą įvykį</button><button class="primary" type="submit">Išsaugoti įvykį</button></div>
  </form>
</dialog>
