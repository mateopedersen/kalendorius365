<!doctype html>
<html lang="lt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f4">
    <title>Kalendorius365 — Svetainė ruošiama</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17251d;
        background: #f6f7f4;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 8vw, 5rem) 1.5rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e4e9e3;
        border-radius: 1.25rem;
        box-shadow: 0 1.5rem 4rem rgb(23 37 29 / 7%);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 1rem 0 0;
        color: #53665a;
        font-size: clamp(1.05rem, 3vw, 1.25rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kalendorius365</h1>
      <p>Svetainė ruošiama.</p>
    </main>
  </body>
</html>
