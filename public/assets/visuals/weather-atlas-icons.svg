  </symbol>
  <symbol id="sun" viewBox="0 0 64 64"><use href="#solar"/></symbol>
  <symbol id="moon" viewBox="0 0 64 64"><use href="#lunar"/></symbol>
  <symbol id="part-night" viewBox="0 0 64 64"><use href="#lunar" transform="translate(17 -2) scale(.79)"/><use href="#lightCloud" transform="translate(0 15) scale(.92)"/></symbol>
  <symbol id="part" viewBox="0 0 64 64"><use href="#solar" transform="translate(19 -2) scale(.71)"/><use href="#lightCloud" transform="translate(0 15) scale(.92)"/></symbol>
  <symbol id="cloud" viewBox="0 0 64 64"><use href="#lightCloud" transform="translate(0 5)"/></symbol>
  <symbol id="rain" viewBox="0 0 64 64"><use href="#rainCloud" transform="translate(1 -1) scale(.96)"/><use href="#rainDrop" transform="translate(18 43)"/><use href="#rainDrop" transform="translate(32 46)"/><use href="#rainDrop" transform="translate(46 43)"/></symbol>
  <symbol id="snow" viewBox="0 0 64 64"><use href="#lightCloud" transform="translate(1 -1) scale(.96)"/><use href="#flake" transform="translate(17 50)"/><use href="#flake" transform="translate(32 55)"/><use href="#flake" transform="translate(47 50)"/></symbol>
  <symbol id="sleet" viewBox="0 0 64 64"><use href="#rainCloud" transform="translate(1 -1) scale(.96)"/><use href="#flake" transform="translate(16 50)"/><use href="#rainDrop" transform="translate(32 46)"/><use href="#flake" transform="translate(48 50)"/></symbol>
  <symbol id="thunder" viewBox="0 0 64 64"><use href="#rainCloud" transform="translate(1 -1) scale(.96)"/><path d="m33 33-9 15h8l-4 13 14-18h-9l6-10z" fill="#ffca64" stroke="#b3762b"/><use href="#rainDrop" transform="translate(15 43) scale(.8)"/><use href="#rainDrop" transform="translate(49 43) scale(.8)"/></symbol>
  <symbol id="fog" viewBox="0 0 64 64"><use href="#lightCloud" transform="translate(4 -4) scale(.86)"/><path d="M7 39h46M11 47h46M7 55h40" stroke="#7897a7" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="wind" viewBox="0 0 64 64"><path d="M7 21h33c11 0 9-13 2-13-4 0-6 2-7 5M5 33h46c11 0 10 13 2 13m-44-1h22c9 0 12 11 4 13" fill="none" stroke="#507c8e" stroke-width="4" stroke-linecap="round"/></symbol>
