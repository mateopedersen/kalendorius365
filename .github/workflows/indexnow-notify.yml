name: Notify IndexNow for changed public URLs

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'scripts/indexnow_notify.py'
      - '.github/workflows/indexnow-notify.yml'

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Wait for the successful Cloudflare Pages release and notify changed URLs
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/indexnow_notify.py --base "$BASE_SHA" --head "$HEAD_SHA" --post --wait-seconds 1200
      - name: Save the submission outcome in the run summary
        if: always()
        run: echo 'The IndexNow submission JSON is recorded in the preceding step. HTTP 200 means received; HTTP 202 means key validation is still pending.' >> "$GITHUB_STEP_SUMMARY"
