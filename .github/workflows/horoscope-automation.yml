name: Daily Lithuanian horoscopes

on:
  pull_request:
    paths:
      - '.github/workflows/horoscope-automation.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - 'lib/horoscopes_pages.rb'
      - 'scripts/horoscopes/**'
      - 'scripts/validate_horoscopes.py'
      - 'site/_data/horoscope_*.json'
      - 'site/horoskopai/**'
      - 'docs/horoscopes/**'
  schedule:
    - cron: '20 6 * * *'
      timezone: 'Europe/Vilnius'
    - cron: '20 8 * * *'
      timezone: 'Europe/Vilnius'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-horoscopes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run offline source, content and atomic-publication tests
        run: python3 scripts/horoscopes/test_pipeline.py
      - name: Validate published data, workflow syntax and Ruby source
        run: |
          python3 scripts/validate_horoscopes.py
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/horoscope-automation.yml", aliases: true)'
          ruby -c lib/horoscopes_pages.rb
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build the complete indexable Jekyll release
        run: K365_RELEASE=1 bundle exec ruby scripts/build.rb
      - name: Check all generated horoscope routes, metadata, canonicals and sitemap entries
        run: python3 scripts/validate_horoscopes.py --check-rendered --release

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Determine whether today's Lithuanian set needs publication
        id: target
        run: python3 scripts/horoscopes/publish.py --check-date
      - name: Fetch 12 calculation-only records and prepare original Lithuanian content
        id: generate
        if: steps.target.outputs.needs_publish == 'true'
        run: python3 scripts/horoscopes/publish.py
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        if: steps.generate.outputs.changed == 'true'
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build the indexable static release
        if: steps.generate.outputs.changed == 'true'
        run: K365_RELEASE=1 bundle exec ruby scripts/build.rb
      - name: Validate current date, all 12 signs and generated indexable pages
        if: steps.generate.outputs.changed == 'true'
        run: |
          python3 scripts/validate_horoscopes.py --require-current --check-rendered --release
          git diff --check
      - name: Commit the validated daily pages for the existing Cloudflare Pages integration
        id: publish_commit
        if: steps.generate.outputs.changed == 'true'
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main changed during generation; refusing to overwrite concurrent work" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/_data/horoscope_current.json site/horoskopai public/horoskopai public/sitemap.xml public/index.html public/assets/data/search.json docs/horoscopes/validation/horoscope-source-qa.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish daily Lithuanian horoscope set"
            git push origin HEAD:refs/heads/main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify all 13 live Cloudflare Pages routes and their current indexable date
        run: python3 scripts/horoscopes/verify_live.py --date "${{ steps.target.outputs.target_date }}" --max-wait-seconds 300
      - name: Record the failure while retaining the last successful publication date
        if: failure()
        run: |
          current_date=$(python3 -c 'import json; print(json.load(open("site/_data/horoscope_current.json", encoding="utf-8")).get("local_date", "unknown"))')
          {
            echo "## Daily horoscope publication did not complete"
            echo
            echo "- Target date: ${{ steps.target.outputs.target_date }}"
            echo "- Last data date in this run: ${current_date}"
            echo "- Check the failed step above; the publisher does not label old content as current."
          } >> "$GITHUB_STEP_SUMMARY"
