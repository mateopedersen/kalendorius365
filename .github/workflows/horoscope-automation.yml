name: Daily Lithuanian horoscopes

on:
  pull_request:
    paths:
      - '.github/workflows/horoscope-automation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - 'lib/horoscopes_pages.rb'
      - 'lib/asset_release.rb'
      - 'scripts/build.rb'
      - 'site/_plugins/asset_versions.rb'
      - 'test/cache-release.test.js'
      - 'scripts/horoscopes/**'
      - 'scripts/validate_horoscopes.py'
      - 'site/_data/horoscope_*.json'
      - 'site/horoskopai/**'
      - 'docs/horoscopes/**'
  schedule:
    # GitHub has delayed/dropped the single scheduled attempt for hours.
    # Publish before 06:20 and retry every 30 minutes through late morning.
    # The publisher is date-idempotent, so only a missing/stale daily set writes.
    - cron: '17,47 5-10 * * *'
      timezone: 'Europe/Vilnius'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-horoscopes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install the pinned lunar image validator
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Run offline source, content and atomic-publication tests
        run: python3 scripts/horoscopes/test_pipeline.py
      - name: Validate published data, workflow syntax and Ruby source
        run: |
          python3 scripts/validate_horoscopes.py
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/horoscope-automation.yml", aliases: true)'
          ruby -c lib/horoscopes_pages.rb
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install the pinned JavaScript compiler
        run: npm ci
      - name: Build the complete indexable Jekyll release
        run: K365_RELEASE=1 bundle exec ruby scripts/build.rb
      - name: Check all generated horoscope routes, metadata, canonicals and sitemap entries
        run: python3 scripts/validate_horoscopes.py --check-rendered --release

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install the pinned lunar image validator
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Determine whether today's Lithuanian set needs publication
        id: target
        run: python3 scripts/horoscopes/publish.py --check-date
      - name: Fetch 12 calculation-only records and prepare original Lithuanian content
        id: generate
        if: steps.target.outputs.needs_publish == 'true'
        run: python3 scripts/horoscopes/publish.py
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        if: steps.generate.outputs.changed == 'true'
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.generate.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install the pinned JavaScript compiler
        if: steps.generate.outputs.changed == 'true'
        run: npm ci
      - name: Build the indexable static release
        if: steps.generate.outputs.changed == 'true'
        run: K365_RELEASE=1 bundle exec ruby scripts/build.rb
      - name: Validate current date, all 12 signs and generated indexable pages
        if: steps.generate.outputs.changed == 'true'
        run: |
          python3 scripts/validate_horoscopes.py --require-current --check-rendered --release
          python3 scripts/audit_site.py --release
          node --test test/*.test.js
          git diff --check
      - name: Commit the validated daily pages for the existing Cloudflare Pages integration
        id: publish_commit
        if: steps.generate.outputs.changed == 'true'
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main changed during generation; refusing to overwrite concurrent work" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A data-only update changes the content-addressed asset graph on
          # every page. Commit the complete generated output atomically.
          git add site/_data/horoscope_current.json site/horoskopai site/assets/data/search.json public docs/horoscopes/validation/horoscope-source-qa.json docs/performance
          # The pinned jsPDF distribution contains upstream trailing spaces.
          # Exclude only that immutable third-party payload from whitespace QA.
          git diff --cached --check -- . ':(exclude,glob)public/assets/releases/**/vendor/jspdf-4.2.1.umd.min.js'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish daily Lithuanian horoscope set"
            git push origin HEAD:refs/heads/main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify all 13 live Cloudflare Pages routes and their current indexable date
        run: python3 scripts/horoscopes/verify_live.py --date "${{ steps.target.outputs.target_date }}" --max-wait-seconds 1200
      - name: Notify IndexNow after the daily Pages release is live
        if: steps.publish_commit.outputs.changed == 'true'
        continue-on-error: true
        run: python3 scripts/indexnow_notify.py --base "$GITHUB_SHA" --head "$(git rev-parse HEAD)" --post --wait-seconds 1200
      - name: Record the failure while retaining the last successful publication date
        if: failure()
        run: |
          current_date=$(python3 -c 'import json; print(json.load(open("site/_data/horoscope_current.json", encoding="utf-8")).get("local_date", "unknown"))')
          {
            echo "## Daily horoscope publication did not complete"
            echo
            echo "- Target date: ${{ steps.target.outputs.target_date }}"
            echo "- Last data date in this run: ${current_date}"
            echo "- Check the failed step above; the publisher does not label old content as current."
          } >> "$GITHUB_STEP_SUMMARY"
