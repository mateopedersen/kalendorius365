name: Verify and assemble the requested Kalendorius365 release

on:
  push:
    branches: [codex/weather-mobile-release-20261121]

permissions:
  contents: write

concurrency:
  group: kalendorius365-release-candidate
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install the pinned release tools
        run: |
          python3 -m pip install -r requirements-print.txt
          npm ci
      - name: Build the production site
        run: K365_RELEASE=1 bundle exec ruby scripts/build.rb
      - name: Validate Lithuanian page data, calendar media and sitemaps
        run: |
          python3 scripts/validate_assets.py
          python3 scripts/validate_calendar_pages.py
          python3 scripts/validate_horoscopes.py --require-current --check-rendered --release
          python3 scripts/audit_site.py --release
      - name: Run the automated regression suites
        run: |
          python3 scripts/horoscopes/test_pipeline.py
          python3 -m unittest test.test_search_automation test.test_indexnow_notify test.css_route_split_test test.inline_route_css_test test.sharing_snapshot_test
          ruby test/css_minifier_test.rb
          ruby test/static_asset_urls_test.rb
          node --test test/*.test.js test/shopping-guides.test.mjs
      - name: Assemble the verified production commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/k365-one-time-release.yml
          git add --all
          git diff --cached --check -- . ':(exclude,glob)public/assets/releases/**/vendor/jspdf-4.2.1.umd.min.js'
          git commit -m "Assemble verified Lithuanian weather, calendar and mobile release"
          git push origin HEAD:refs/heads/codex/weather-mobile-release-20261121-verified
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
