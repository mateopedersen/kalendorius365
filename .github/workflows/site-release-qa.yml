name: Static site release QA

on:
  pull_request:
    paths:
      - '.github/workflows/site-release-qa.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - 'lib/**'
      - 'site/_config.yml'
      - 'scripts/**'
      - 'scripts/build.rb'
      - 'scripts/css_route_split.py'
      - 'scripts/pages.rb'
      - 'scripts/audit_site.py'
      - 'site/**'
      - 'public/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install the pinned JavaScript compiler
        run: npm ci
      - name: Build the complete static release
        run: K365_RELEASE=1 bundle exec ruby scripts/build.rb
      - name: Capture regenerated public output for parity repair
        run: |
          git add --intent-to-add -- public
          git diff --binary -- public > public-build.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated-public-output
          path: public-build.patch
          retention-days: 1
      - name: Verify committed public files match the release build
        run: git diff --exit-code -- public
      - name: Check CSS minifier whitespace safety
        run: ruby test/css_minifier_test.rb
      - name: Verify route-specific CSS pruning and page bundles
        run: python3 -m unittest test.css_route_split_test test.inline_route_css_test
      - name: Verify immutable static asset URL versioning
        run: ruby test/static_asset_urls_test.rb
      - name: Audit every canonical page and internal link
        run: python3 scripts/audit_site.py --release
      - name: Run calendar, search, planner and solar tests
        run: node --test test/*.test.js
      - name: Save the verified generated release for integration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-site-${{ github.sha }}
          path: |
            public/
            site/assets/data/search.json
            docs/lunar/qa/pages-language-semantics.json
            docs/2027-monthly-holidays/QA-GATE-1.json
          if-no-files-found: error
          retention-days: 1
